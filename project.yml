name: AutoLedger
options:
  bundleIdPrefix: com.autoledger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # SWIFT_VERSION 是「语言模式」，不是编译器版本，只接受 4.0 / 4.2 / 5.0 / 6.0。
    # 写成 5.9 会在编译任何文件前直接报错：
    #   error: SWIFT_VERSION '5.9' is unsupported
    # 用 5.0（Swift 5 语言模式），配合 Xcode 26 的编译器即可。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  AutoLedger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoLedger
        excludes:
          - "Info.plist"
    # 显式声明 scheme，xcodegen 才会生成共享 .xcscheme，
    # xcodebuild archive -scheme AutoLedger 依赖它。
    scheme:
      gatherCoverageData: false
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autoledger.app
        PRODUCT_NAME: AutoLedger
        INFOPLIST_FILE: AutoLedger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
