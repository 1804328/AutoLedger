name: Skeleton
options:
  bundleIdPrefix: com.autoledger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 语言模式，不是编译器版本（只接受 4.0 / 4.2 / 5.0 / 6.0）
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

# 这是「零原生代码」的骨架工程，唯一用途是验证工具链：
#   xcodegen generate -> xcodebuild archive -> Payload -> unsigned.ipa
# 它只有 1 个 Swift 文件、不引用 Charts / AppIntents / 任何资源目录，
# 所以它编不过只可能是**环境或 workflow** 的问题，绝无可能是业务代码的问题。
# 骨架绿了，再往上加业务代码，报错就一定能定位到是谁。
targets:
  Skeleton:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Skeleton
        excludes:
          - "Info.plist"
    scheme:
      gatherCoverageData: false
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autoledger.skeleton
        PRODUCT_NAME: Skeleton
        INFOPLIST_FILE: Skeleton/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # 故意不设 ASSETCATALOG_COMPILER_APPICON_NAME：骨架不带资源目录，
        # 设了反而会因为找不到 AppIcon 而报错，污染「工具链是否正常」的判断。
