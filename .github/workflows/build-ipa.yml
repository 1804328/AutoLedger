name: Build unsigned IPA

# 免费签名路线：macOS runner 只负责编译出**未签名**的 .ipa / .app，
# 用户再用 Sideloadly / AltStore / TrollStore 等工具、用免费 Apple ID 或自签证书
# 在 Windows / 自己的机器上签名安装。不需要 Mac，也不需要 99 美元开发者账号。
#
# 用法：推送到 GitHub → Actions 里手动 Run workflow（或 push 到 main 自动触发）
#      → 跑完在 Artifacts 里下载 AutoLedger-ipa / AutoLedger-app
#
# ─────────────────────────── 已知的坑（踩过，别再踩） ───────────────────────────
# 1) Public 仓库的 Actions macOS 构建**不计额度**；Private 仓库每月 2000 分钟，
#    但 macOS runner 按 **10 倍** 扣（即实际约 200 分钟），大约只够 5-8 次构建/月。
#    仓库设成 Public 可以白嫖，或按需手动触发、别开 push 全量触发。
# 2) 免费 Apple ID 签名的证书只有 **7 天有效期**，到期需重签；而且
#    **重签会清空 App 的本地数据**（沙盒容器随签名身份变化），用户需自行备份。
# 3) 绝对不要加 `-allowProvisioningUpdates`：它会去连 Apple 账号、尝试自动签名，
#    在无凭据的 CI 上直接失败，而且可能给产物带上残留签名，导致用户自签冲突。
#    本流水线全程 CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO / CODE_SIGN_IDENTITY=""。
# 4) 打包 ipa 必须用 `zip -qry`（-y 保留符号链接），普通 zip 会破坏 .app 内部结构。
# 5) macOS 镜像里预装多个 Xcode，但**只有默认版本预装了 iOS 平台组件**；
#    切换 Xcode 后如果缺 iOS SDK，构建会失败，所以要保留下面「选 Xcode + 失败换版本重试」的逻辑。

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "构建阶段：先 skeleton 确认工具链绿了，再跑 app"
        required: true
        default: skeleton
        type: choice
        options:
          - skeleton
          - app
      configuration:
        description: "构建配置（默认 Release）"
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
  push:
    branches: [main]
    # 只有动到工程 / 流水线本身才构建，避免改个 README 也烧掉一次 macOS 额度。
    paths:
      - "AutoLedger/**"
      - "skeleton/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

# 故意不设 concurrency：多人/多次手动触发时，不要互相取消正在跑的构建
# 注：GitHub 对「首次推送就包含 workflow 文件」不会触发 push 事件，
# 所以首次需要手动 Run workflow，或像下面这样再推一次有实质文件改动的提交。

permissions:
  contents: read

env:
  BUILD_DIR: build
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  # 骨架阶段已验证通过（run#2 成功产出 Skeleton.ipa），默认阶段切到 app，推一次就构建正式包。
  # 想重验工具链可手动 Run workflow 选 skeleton。
  STAGE: ${{ github.event.inputs.stage || 'app' }}

jobs:
  build:
    # macos-26 是较新的标签，部分公开仓库/组织还没开通，会一直 queued 拿不到 runner。
    # macos-14 是最稳的公开镜像（Xcode 15/16 系列）。若你确认账号支持 macos-26，可改回。
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 分阶段构建的核心：所有后续步骤都读这里输出的变量，不再写死 AutoLedger。
      # skeleton = 零原生代码，编不过只可能是环境/workflow 问题；
      # app      = 完整业务代码，编不过才可能是我们的 Swift 问题。
      - name: 解析构建阶段
        id: cfg
        run: |
          set -euo pipefail
          case "${STAGE}" in
            skeleton)
              proj_dir="skeleton"; target="Skeleton"; product="Skeleton"
              bundle_id="com.autoledger.skeleton"; needs_patch="false"
              echo "==> 阶段 1/2：骨架工程（零原生代码，只验工具链）"
              ;;
            app)
              proj_dir="."; target="AutoLedger"; product="AutoLedger"
              bundle_id="com.autoledger.app"; needs_patch="true"
              echo "==> 阶段 2/2：主工程（完整业务代码）"
              ;;
            *)
              echo "::error::未知构建阶段：${STAGE}"
              exit 1
              ;;
          esac
          {
            echo "project_dir=${proj_dir}"
            echo "target=${target}"
            echo "product=${product}"
            echo "bundle_id=${bundle_id}"
            echo "needs_scheme_patch=${needs_patch}"
          } >> "$GITHUB_OUTPUT"

      - name: 选择 Xcode（需要已安装 iOS 平台）
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          echo "--- 默认 Xcode ---"
          xcodebuild -version || true

          DEFAULT_MAJOR="$(xcodebuild -version 2>/dev/null | head -1 | sed -E 's/^Xcode ([0-9]+).*/\1/' || true)"
          echo "默认 Xcode 主版本: ${DEFAULT_MAJOR:-未知}"

          # 策略：优先用默认 Xcode（镜像只为默认版本预装 iOS 平台组件）。
          # 只有当默认版本低于 iOS 17 所需（Xcode 15）时，才去找版本号最大的可用 Xcode。
          # 注意：按版本号排序用 sort -V，不能按字母序取 head。
          if [ -n "${DEFAULT_MAJOR:-}" ] && [ "${DEFAULT_MAJOR}" -ge 15 ] 2>/dev/null; then
            echo "默认 Xcode ${DEFAULT_MAJOR}.x 满足 iOS 17 构建要求，直接使用"
          else
            XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "${XCODE}" ]; then
              echo "默认版本过低，切换到 $XCODE"
              sudo xcode-select -s "$XCODE/Contents/Developer"
            fi
          fi

          echo "--- 使用中的 Xcode ---"
          xcode-select -p
          xcodebuild -version
          echo "--- 可用 SDK ---"
          xcodebuild -showsdks || true
          echo "--- iphoneos SDK 版本 ---"
          xcrun --sdk iphoneos --show-sdk-version

      # 仓库根目录可能直接就是工程目录，也可能有一层 AutoLedger/ 子目录。
      # 统一探测 project.yml 所在目录，后续步骤都以它为工作目录，两种布局都能跑。
      - name: 定位工程目录
        id: locate
        run: |
          set -euo pipefail
          if [ -f "AutoLedger/project.yml" ]; then
            proj_dir="AutoLedger"
          elif [ -f "project.yml" ]; then
            proj_dir="."
          else
            echo "::error::找不到 project.yml，请确认仓库结构"
            exit 1
          fi
          # 主工程在仓库根的 AutoLedger/ 下；骨架工程在 AutoLedger/skeleton/ 下。
          # 统一成「相对仓库根」的路径，并拼出阶段子目录。
          stage_dir="${proj_dir}/${{ steps.cfg.outputs.project_dir }}"
          if [ "${{ steps.cfg.outputs.project_dir }}" = "." ]; then
            stage_dir="${proj_dir}"
          fi
          if [ ! -f "${stage_dir}/project.yml" ]; then
            echo "::error::阶段目录 ${stage_dir} 下没有 project.yml"
            exit 1
          fi
          echo "stage_dir=${stage_dir}" >> "$GITHUB_OUTPUT"
          echo "工程目录: ${stage_dir}"

      - name: 安装 XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen 已预装，跳过 brew install"
          else
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ${{ steps.locate.outputs.stage_dir }}
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          ls -la

      # project.yml 里没有声明 scheme:，XcodeGen 就不会生成 .xcscheme，
      # 而 xcodebuild -scheme 必须要有共享 scheme 才能 archive。
      # 该脚本只写 xcodegen 生成的 *.xcodeproj（构建产物、已被 .gitignore 忽略），
      # 不动任何源码 / project.yml / Info.plist / Assets；幂等，已存在则跳过。
      - name: 确保共享 scheme 存在
        if: steps.cfg.outputs.needs_scheme_patch == 'true'
        working-directory: ${{ steps.locate.outputs.stage_dir }}
        run: |
          set -euo pipefail
          python3 tools/ensure_scheme.py . \
            --target "${{ steps.cfg.outputs.target }}" \
            --product "${{ steps.cfg.outputs.product }}.app" \
            --configuration "${CONFIGURATION}"
          xcodebuild -project "${{ steps.cfg.outputs.target }}.xcodeproj" -list

      - name: 编译未签名 .app（archive）
        working-directory: ${{ steps.locate.outputs.stage_dir }}
        run: |
          set -euo pipefail
          LOG="$PWD/build.log"
          PRODUCT="${{ steps.cfg.outputs.product }}"
          TARGET="${{ steps.cfg.outputs.target }}"
          XCODE_PROJECT="${TARGET}.xcodeproj"

          build_once() {
            set -o pipefail
            rm -rf "${BUILD_DIR}/${PRODUCT}.xcarchive" "${BUILD_DIR}/DerivedData"
            xcodebuild archive \
              -project "${XCODE_PROJECT}" \
              -scheme "${TARGET}" \
              -configuration "${CONFIGURATION}" \
              -destination 'generic/platform=iOS' \
              -archivePath "${BUILD_DIR}/${PRODUCT}.xcarchive" \
              -derivedDataPath "${BUILD_DIR}/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              ONLY_ACTIVE_ARCH=NO \
              2>&1 | tee "$LOG"
          }

          summarize() {
            echo "================ 错误摘要 ================"
            grep -nE "error:|fatal error:|❌|Command .* failed|failed with a nonzero exit code" \
              "$LOG" | tail -n 80 || true
            echo "=========================================="
          }

          # 首选当前 Xcode；失败则按版本号从新到旧逐个尝试（镜像只为部分 Xcode 预装 iOS 平台）
          if build_once; then
            exit 0
          fi
          summarize
          echo "=== 当前 Xcode 构建失败，尝试切换其它 Xcode 重试 ==="
          xcodebuild -showdestinations -project "${XCODE_PROJECT}" -scheme "${TARGET}" || true

          for XCODE in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            echo "--- 尝试 $XCODE ---"
            sudo xcode-select -s "$XCODE/Contents/Developer"
            xcodebuild -version
            if build_once; then
              echo "=== 使用 $XCODE 构建成功 ==="
              exit 0
            fi
            summarize
          done

          echo "=== 所有候选 Xcode 均构建失败 ==="
          exit 1

      - name: 打包成未签名 IPA
        working-directory: ${{ steps.locate.outputs.stage_dir }}
        run: |
          set -euo pipefail
          PRODUCT="${{ steps.cfg.outputs.product }}"
          BUNDLE_ID="${{ steps.cfg.outputs.bundle_id }}"
          APP="${BUILD_DIR}/${PRODUCT}.xcarchive/Products/Applications/${PRODUCT}.app"
          if [ ! -d "$APP" ]; then
            echo "没有找到 .app"
            find "${BUILD_DIR}/${PRODUCT}.xcarchive" -maxdepth 4 -type d -name '*.app' || true
            exit 1
          fi
          echo "app: $APP"

          # 二次确认产物未被签名（未签名 = 没有 _CodeSignature，codesign 也查不到）
          if [ -d "$APP/_CodeSignature" ]; then
            echo "::warning::产物中存在 _CodeSignature，移除以保证未签名"
            rm -rf "$APP/_CodeSignature"
          fi
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "::warning::检测到残留签名，执行移除"
            codesign --remove-signature "$APP" || true
          fi
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "::error::产物仍然带签名，用户自签会冲突"
            exit 1
          fi
          echo "OK: 产物为未签名 app"

          # 结构自检：二进制 + bundle id
          test -f "$APP/${PRODUCT}" || { echo "::error::缺少可执行文件 ${PRODUCT}"; exit 1; }
          file "$APP/${PRODUCT}"
          GOT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Bundle ID: $GOT_ID"
          [ "$GOT_ID" = "${BUNDLE_ID}" ] || { echo "::error::bundle id 不是预期的 ${BUNDLE_ID}"; exit 1; }

          rm -rf Payload "${PRODUCT}.ipa"
          mkdir -p Payload
          # ditto 比 cp -R 更完整地保留符号链接 / 权限 / 扩展属性
          ditto "$APP" "Payload/${PRODUCT}.app"

          # 关键：-y 保留符号链接、-r 递归，不能用普通 zip
          zip -qry "${PRODUCT}.ipa" Payload
          ls -lh "${PRODUCT}.ipa"

          # 注意：全程有 pipefail，不能把 unzip 输出管道给 head / grep -q
          # （它们会提前退出，导致 unzip 收到 SIGPIPE，整个步骤被判失败）。
          # 所以先把清单落到文件，再对文件做检查。
          unzip -l "${PRODUCT}.ipa" > "${BUILD_DIR}/ipa-contents.txt"
          sed -n '1,20p' "${BUILD_DIR}/ipa-contents.txt"
          if ! grep -q "Payload/${PRODUCT}.app/" "${BUILD_DIR}/ipa-contents.txt"; then
            echo "::error::ipa 结构不正确，缺少 Payload/${PRODUCT}.app/"
            exit 1
          fi

          # 另存一份 .app，供只接受 .app 的签名工具使用
          rm -rf artifact-app
          mkdir -p artifact-app
          ditto "$APP" "artifact-app/${PRODUCT}.app"
          SYMLINKS="$(find "artifact-app/${PRODUCT}.app" -type l -print -quit)"
          if [ -n "${SYMLINKS}" ]; then
            echo "::warning::.app 中存在符号链接，zip 上传会丢失链接，建议改用 tar.gz 分发"
          fi

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.product }}-ipa
          path: ${{ steps.locate.outputs.stage_dir }}/${{ steps.cfg.outputs.product }}.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 上传未签名 APP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.product }}-app
          path: ${{ steps.locate.outputs.stage_dir }}/artifact-app/${{ steps.cfg.outputs.product }}.app
          retention-days: 30
          if-no-files-found: error

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.product }}-build-log
          path: |
            ${{ steps.locate.outputs.stage_dir }}/build.log
            ${{ steps.locate.outputs.stage_dir }}/build/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore

      - name: 构建摘要
        if: success()
        run: |
          {
            echo "## 构建完成（阶段：\`${STAGE}\`）"
            echo ""
            echo "- 工程: \`${{ steps.cfg.outputs.target }}\`"
            echo "- 配置: \`${CONFIGURATION}\`"
            echo "- 产物 1: \`${{ steps.cfg.outputs.product }}-ipa\` → ${{ steps.cfg.outputs.product }}.ipa（未签名）"
            echo "- 产物 2: \`${{ steps.cfg.outputs.product }}-app\` → ${{ steps.cfg.outputs.product }}.app（未签名）"
            echo "- Bundle ID: \`${{ steps.cfg.outputs.bundle_id }}\`"
            echo ""
            if [ "${STAGE}" = "skeleton" ]; then
              echo "> 这是**骨架**构建，只证明工具链正常。"
              echo "> 下一步：手动 Run workflow，stage 选 \`app\`，构建真正的业务代码。"
            else
              echo "> 产物完全未签名。请用 Sideloadly / AltStore / 自签证书处理后再安装。"
              echo "> 免费 Apple ID 签名仅 7 天有效，且重签会清空 App 本地数据，请提前备份。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
